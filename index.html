<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aviator Crash Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0e1117; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    
    .game-container {
      width: 760px;
      background: #171a21;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #2a2e39;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .balance { color: #00e676; font-weight: bold; }

    canvas {
      width: 100%;
      height: 380px;
      background: #0d0f15;
      border-radius: 12px;
      display: block;
      border: 1px solid #222634;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      align-items: center;
    }

    .bet-box {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    input[type="number"] {
      background: #222634;
      border: 1px solid #32384a;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      width: 150px;
      outline: none;
    }

    .btn {
      flex: 1;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      text-transform: uppercase;
    }

    .btn-bet { background: #e51b38; color: #fff; }
    .btn-bet:hover { background: #ff2a4b; }

    .btn-cashout { background: #ff9800; color: #171a21; }
    .btn-cashout:hover { background: #ffb74d; }

    .btn:disabled { background: #32384a; color: #777; cursor: not-allowed; }

    .history {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .badge {
      background: #222634;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge.high { color: #00e676; }
    .badge.low { color: #e51b38; }
  </style>
</head>
<body>

<div class="game-container">
  <div class="top-bar">
    <div><strong>AVIATOR</strong></div>
    <div class="balance">Balance: $<span id="balance">1000.00</span></div>
  </div>

  <canvas id="gameCanvas" width="720" height="380"></canvas>

  <div class="history" id="history"></div>

  <div class="controls">
    <div class="bet-box">
      <label style="font-size: 12px; color: #888;">Bet Amount ($)</label>
      <input type="number" id="betAmount" value="50" min="10" step="10">
    </div>
    <button id="actionBtn" class="btn btn-bet">Place Bet</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const balanceEl = document.getElementById('balance');
  const betInput = document.getElementById('betAmount');
  const actionBtn = document.getElementById('actionBtn');
  const historyEl = document.getElementById('history');

  let balance = 1000.00;
  let state = 'IDLE'; // IDLE, FLYING, CRASHED
  let currentMultiplier = 1.00;
  let crashPoint = 1.00;
  let bet = 0;
  let animationId = null;
  let startTime = 0;

  // Realistic crash generator with 3% House Edge (RTP = 97%)
  function generateCrashPoint() {
    const e = 0.03; // house edge
    const r = Math.random();
    let crash = (1 - e) / (1 - r);
    return Math.max(1.00, Math.floor(crash * 100) / 100);
  }

  function addHistory(mult) {
    const badge = document.createElement('div');
    badge.className = `badge ${mult >= 2.0 ? 'high' : 'low'}`;
    badge.innerText = mult.toFixed(2) + 'x';
    historyEl.prepend(badge);
    if (historyEl.children.length > 8) historyEl.removeChild(historyEl.lastChild);
  }

  function draw(progress) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Grid Lines
    ctx.strokeStyle = '#1b1f2b';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    const startX = 40;
    const startY = canvas.height - 40;

    if (state === 'FLYING' || state === 'CRASHED') {
      // Calculate curve endpoints
      const clampedProg = Math.min(progress, 1);
      const endX = startX + (canvas.width - 120) * clampedProg;
      const endY = startY - (canvas.height - 100) * Math.pow(clampedProg, 1.4);

      // Draw flight curve
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(startX + (endX - startX) * 0.5, startY, endX, endY);
      ctx.strokeStyle = state === 'CRASHED' ? '#555' : '#e51b38';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Draw Plane / Indicator
      if (state === 'FLYING') {
        ctx.fillStyle = '#ff2a4b';
        ctx.beginPath();
        ctx.arc(endX, endY, 8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Draw Central Multiplier Text
    ctx.textAlign = 'center';
    if (state === 'CRASHED') {
      ctx.fillStyle = '#e51b38';
      ctx.font = 'bold 38px Segoe UI';
      ctx.fillText('FLEW AWAY!', canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = 'bold 54px Segoe UI';
      ctx.fillText(`${crashPoint.toFixed(2)}x`, canvas.width / 2, canvas.height / 2 + 45);
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 64px Segoe UI';
      ctx.fillText(`${currentMultiplier.toFixed(2)}x`, canvas.width / 2, canvas.height / 2 + 20);
    }
  }

  function gameLoop(timestamp) {
    if (!startTime) startTime = timestamp;
    const elapsed = (timestamp - startTime) / 1000;

    // Multiplier grows exponentially over time
    currentMultiplier = Math.floor((1.0 + Math.pow(elapsed * 0.8, 1.8)) * 100) / 100;

    if (currentMultiplier >= crashPoint) {
      crash();
      return;
    }

    // Normalize progress for drawing the curve up to ~10x
    const progress = Math.min(elapsed / 8.0, 1.0);
    draw(progress);

    if (state === 'FLYING') {
      animationId = requestAnimationFrame(gameLoop);
    }
  }

  function startGame() {
    const betVal = parseFloat(betInput.value);
    if (isNaN(betVal) || betVal <= 0 || betVal > balance) {
      alert('Invalid bet amount or insufficient balance!');
      return;
    }

    bet = betVal;
    balance -= bet;
    balanceEl.innerText = balance.toFixed(2);

    crashPoint = generateCrashPoint();
    currentMultiplier = 1.00;
    state = 'FLYING';
    startTime = 0;

    actionBtn.className = 'btn btn-cashout';
    actionBtn.innerText = 'Cash Out';
    betInput.disabled = true;

    animationId = requestAnimationFrame(gameLoop);
  }

  function cashOut() {
    if (state !== 'FLYING') return;

    const winAmount = Math.floor((bet * currentMultiplier) * 100) / 100;
    balance += winAmount;
    balanceEl.innerText = balance.toFixed(2);

    actionBtn.disabled = true;
    actionBtn.innerText = `Cashed out $${winAmount.toFixed(2)}!`;
  }

  function crash() {
    state = 'CRASHED';
    cancelAnimationFrame(animationId);
    draw(1);
    addHistory(crashPoint);

    actionBtn.className = 'btn btn-bet';
    actionBtn.innerText = 'Place Bet';
    actionBtn.disabled = false;
    betInput.disabled = false;
  }

  actionBtn.addEventListener('click', () => {
    if (state === 'IDLE' || state === 'CRASHED') {
      startGame();
    } else if (state === 'FLYING') {
      cashOut();
    }
  });

  draw(0);
</script>

</body>
</html>
